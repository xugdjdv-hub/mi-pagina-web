<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CriptoshX · Crypto Intelligence</title>
<style>
/* ============================================================
   RESET BÁSICO DEL DASHBOARD (demo)
   ============================================================ */
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #0a0a0c;
    color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.dashboard {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px;
}
.dashboard h1 {
    font-size: 28px;
    margin-bottom: 4px;
}
.dashboard p.sub {
    color: #77777f;
    margin-top: 0;
    margin-bottom: 28px;
}
.coin-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
}
.coin-card {
    border: 1px solid #202024;
    border-radius: 12px;
    padding: 14px;
    background: #101012;
}
.coin-card .sym {
    font-weight: 700;
    letter-spacing: .02em;
}
.coin-card .price {
    color: #72f2c2;
    font-variant-numeric: tabular-nums;
    margin-top: 4px;
}

/* ============================================================
   CRIPTOSHX V12 ULTRA - BOOT SCREEN
   ============================================================ */

#bootScreen {
    position: fixed;
    inset: 0;
    z-index: 2147483647;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(114,242,194,.075),
            transparent 34%
        ),
        #050607;

    opacity: 1;
    visibility: visible;

    transition:
        opacity .55s ease,
        visibility .55s ease;
}

#bootScreen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

body.cx-booting {
    overflow: hidden !important;
}

.bootBox {
    width: min(720px, 88vw);
    text-align: center;
}

.bootLogo {
    font-size: clamp(36px, 7vw, 52px);
    line-height: 1;
    font-weight: 950;
    letter-spacing: -.055em;
    margin-bottom: 10px;
    color: #f5f5f7;
}

.bootLogo span {
    color: #72f2c2;
}

.bootSub {
    color: #696970;
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin-bottom: 34px;
}

.bootLine {
    height: 4px;
    background: #151518;
    border-radius: 999px;
    overflow: hidden;
    box-shadow:
        0 0 0 1px rgba(255,255,255,.025),
        0 0 24px rgba(114,242,194,.05);
}

.bootLine i {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, #72f2c2, #8ab4ff);
    box-shadow: 0 0 14px rgba(114,242,194,.35);
    transition: width .35s cubic-bezier(.2,.8,.2,1);
}

.bootMeta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-top: 12px;
    color: #77777f;
    font-size: 11px;
}

.bootStatus {
    min-height: 17px;
    text-align: left;
}

#bootPercent {
    color: #f5f5f7;
    font-weight: 850;
    font-variant-numeric: tabular-nums;
}

.bootNodes {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 28px;
}

.bootNode {
    padding: 6px 10px;
    border: 1px solid #202024;
    border-radius: 999px;
    color: #55555d;
    font-size: 8px;
    letter-spacing: .12em;
    transition:
        color .25s ease,
        border-color .25s ease,
        background .25s ease;
}

.bootNode.active {
    color: #72f2c2;
    border-color: rgba(114,242,194,.35);
    background: rgba(114,242,194,.05);
}

.bootError {
    display: none;
    margin-top: 24px;
    border: 1px solid #29292d;
    background: #0b0b0c;
    border-radius: 14px;
    padding: 15px;
    text-align: left;
}

.bootError b {
    display: block;
    margin-bottom: 6px;
    color: #ff7d8b;
}

.bootError p {
    margin: 0;
    color: #96969e;
    font-size: 11px;
    line-height: 1.5;
}

#bootRetry {
    display: none;
    margin: 15px auto 0;
    border: 1px solid #303036;
    background: #151517;
    color: #fff;
    border-radius: 10px;
    padding: 10px 17px;
    cursor: pointer;
}

#bootRetry:hover {
    background: #1b1b1f;
}

#bootRetry:focus-visible {
    outline: 2px solid #72f2c2;
    outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
    #bootScreen,
    .bootLine i,
    .bootNode {
        transition: none !important;
    }
}
</style>
</head>
<body>

<!-- ==========================================================
     CRIPTOSHX V12 ULTRA BOOT
     ========================================================== -->
<div id="bootScreen" role="status" aria-live="polite" aria-label="Inicializando CriptoshX">
    <div class="bootBox">
        <div class="bootLogo">Criptosh<span>X</span></div>
        <div class="bootSub">Crypto Intelligence · preparando entorno</div>
        <div class="bootLine" aria-hidden="true">
            <i id="bootBar"></i>
        </div>
        <div class="bootMeta">
            <span id="bootText" class="bootStatus">Inicializando motor de datos…</span>
            <span id="bootPercent">0%</span>
        </div>
        <div class="bootNodes">
            <span class="bootNode" id="bootNetwork">NETWORK</span>
            <span class="bootNode" id="bootData">DATA</span>
            <span class="bootNode" id="bootEngine">ENGINE</span>
        </div>
        <div class="bootError" id="bootError">
            <b id="bootErrorTitle">No se pudo sincronizar el mercado</b>
            <p id="bootErrorText">La fuente de datos no respondió correctamente.</p>
        </div>
        <button id="bootRetry" type="button">Reintentar conexión</button>
    </div>
</div>

<!-- ==========================================================
     TU DASHBOARD REAL VA AQUÍ ABAJO
     (esto es solo un ejemplo de demostración)
     ========================================================== -->
<div class="dashboard">
    <h1>CriptoshX</h1>
    <p class="sub">Panel de ejemplo — sustituye esto por tu dashboard real</p>
    <div class="coin-grid" id="coinGrid"></div>
</div>

<script>
/* ============================================================
   DATOS DE EJEMPLO (simula tu window.state.coins)
   En tu proyecto real, esto lo rellena tu propio código
   cuando llegan los datos del mercado.
   ============================================================ */
window.state = { coins: [] };

const demoSymbols = ["BTC","ETH","SOL","XRP","ADA","DOGE","AVAX","DOT","LINK","MATIC",
                      "LTC","BCH","UNI","ATOM","XLM","ETC","FIL","APT","ARB","OP"];

function loadDemoData() {
    // Simula una carga real con retraso
    setTimeout(() => {
        window.state.coins = demoSymbols.map(sym => ({
            id: sym.toLowerCase(),
            symbol: sym,
            current_price: +(Math.random() * 50000).toFixed(2)
        }));

        const grid = document.getElementById("coinGrid");
        grid.innerHTML = window.state.coins.map(c => `
            <div class="coin-card">
                <div class="sym">${c.symbol}</div>
                <div class="price">$${c.current_price.toLocaleString()}</div>
            </div>
        `).join("");

        // Le decimos explícitamente al boot screen que ya está todo listo
        window.__CRIPTOSHX_READY__ = true;
    }, 2200); // simula 2.2s de "carga de red"
}

loadDemoData();
</script>

<!-- ============================================================
     3. MOTOR DE CARGA
     ============================================================ -->
<script>
(() => {
    "use strict";

    const root = document.getElementById("bootScreen");
    if (!root) return;

    const bar = document.getElementById("bootBar");
    const text = document.getElementById("bootText");
    const pct = document.getElementById("bootPercent");
    const err = document.getElementById("bootError");
    const errT = document.getElementById("bootErrorTitle");
    const errP = document.getElementById("bootErrorText");
    const retry = document.getElementById("bootRetry");

    const network = document.getElementById("bootNetwork");
    const data = document.getElementById("bootData");
    const engine = document.getElementById("bootEngine");

    document.body.classList.add("cx-booting");

    let progress = 0;
    let finished = false;
    let failed = false;
    let pulseTimer = null;
    let hardTimeout = null;
    let hideTimer = null;

    const messages = [
        "Inicializando motor de datos…",
        "Conectando con el mercado…",
        "Validando respuesta…",
        "Procesando activos…",
        "Calculando métricas…",
        "Preparando ranking…",
        "Construyendo interfaz…",
        "Sincronizando dashboard…"
    ];

    let messageIndex = 0;

    function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    }

    function setProgress(value, message) {
        if (finished || failed) return;

        const next = clamp(Number(value) || 0, 0, 99);
        progress = Math.max(progress, next);

        bar.style.width = progress.toFixed(1) + "%";
        pct.textContent = Math.round(progress) + "%";

        if (message) text.textContent = message;

        if (progress >= 20) network.classList.add("active");
        if (progress >= 55) data.classList.add("active");
        if (progress >= 82) engine.classList.add("active");
    }

    function cleanup() {
        if (pulseTimer) { clearInterval(pulseTimer); pulseTimer = null; }
        if (hardTimeout) { clearTimeout(hardTimeout); hardTimeout = null; }
        if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    }

    function ready() {
        if (finished || failed) return;
        finished = true;
        cleanup();

        progress = 100;
        bar.style.width = "100%";
        pct.textContent = "100%";
        text.textContent = "Todo listo · entrando a CriptoshX";

        network.classList.add("active");
        data.classList.add("active");
        engine.classList.add("active");

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                hideTimer = setTimeout(() => {
                    root.classList.add("hide");
                    document.body.classList.remove("cx-booting");

                    setTimeout(() => {
                        if (root && root.parentNode) {
                            root.parentNode.removeChild(root);
                        }
                    }, 600);
                }, 350);
            });
        });
    }

    function fail(title, message) {
        if (finished) return;
        failed = true;
        cleanup();

        errT.textContent = title || "No se pudo iniciar CriptoshX";
        errP.textContent = message || "Comprueba la conexión e inténtalo de nuevo.";
        err.style.display = "block";
        retry.style.display = "inline-block";
        text.textContent = "Necesita atención";
    }

    retry.addEventListener("click", () => location.reload());

    window.CXBoot = {
        set: setProgress,
        ready: ready,
        fail: fail,
        getState: () => ({ progress, finished, failed })
    };

    pulseTimer = setInterval(() => {
        if (finished || failed) return;

        if (progress < 88) {
            const increment = progress < 55 ? 2 : 0.8;
            setProgress(progress + increment, messages[messageIndex % messages.length]);
            messageIndex++;
        }
    }, 650);

    hardTimeout = setTimeout(() => {
        if (!finished) {
            fail(
                "La carga está tardando demasiado",
                "CriptoshX no ha conseguido preparar todos los datos. Comprueba Internet y pulsa Reintentar."
            );
        }
    }, 30000);
})();
</script>

<!-- ============================================================
     4. PROTECCIÓN DE FETCH (timeout automático en fetch())
     ============================================================ -->
<script>
(() => {
    "use strict";
    if (window.__CXFetchGuardInstalled) return;
    window.__CXFetchGuardInstalled = true;

    const nativeFetch = window.fetch.bind(window);
    const DEFAULT_TIMEOUT = 15000;

    window.CXNetwork = {
        timeout: DEFAULT_TIMEOUT,
        online: navigator.onLine !== false,
        setTimeout(ms) {
            this.timeout = Math.max(1000, Number(ms) || DEFAULT_TIMEOUT);
        }
    };

    window.addEventListener("online", () => { window.CXNetwork.online = true; });
    window.addEventListener("offline", () => { window.CXNetwork.online = false; });

    window.fetch = function(input, init) {
        const options = { ...(init || {}) };
        const controller = new AbortController();
        const external = options.signal;
        let settled = false;
        let timer = null;

        function abort() {
            if (!controller.signal.aborted) {
                controller.abort(external && external.reason);
            }
        }

        if (external) {
            if (external.aborted) abort();
            else external.addEventListener("abort", abort, { once: true });
        }

        options.signal = controller.signal;

        timer = setTimeout(() => {
            if (!settled && !controller.signal.aborted) {
                controller.abort(new DOMException("Request timed out", "TimeoutError"));
            }
        }, window.CXNetwork.timeout);

        return nativeFetch(input, options).finally(() => {
            settled = true;
            if (timer) clearTimeout(timer);
            if (external) external.removeEventListener("abort", abort);
        });
    };
})();
</script>

<!-- ============================================================
     5. DETECTOR DE DATOS PREPARADOS
     ============================================================ -->
<script>
(() => {
    "use strict";

    const START = performance.now();
    const MAX_WAIT = 30000;
    const MIN_COINS = 20; // cámbialo si quieres otro mínimo

    let lastSignature = "";
    let stableChecks = 0;
    let startedChecking = false;
    let explicitlyReady = false;

    Object.defineProperty(window, "__CRIPTOSHX_READY__", {
        configurable: true,
        get() { return explicitlyReady; },
        set(value) { explicitlyReady = value === true; }
    });

    window.addEventListener("criptoshx:ready", () => { explicitlyReady = true; }, { once: true });

    function getCoins() {
        try {
            if (window.state && Array.isArray(window.state.coins)) return window.state.coins;
            if (Array.isArray(window.coins)) return window.coins;
        } catch (_) {}
        return [];
    }

    function inspect() {
        const coins = getCoins();

        const usable = coins.filter(coin =>
            coin && typeof coin === "object" &&
            Number.isFinite(Number(coin.current_price)) &&
            Number(coin.current_price) >= 0
        );

        const signature = usable.length + ":" +
            (usable.length ? String(usable[0].id || usable[0].symbol || "") : "");

        if (usable.length >= MIN_COINS && signature === lastSignature) {
            stableChecks++;
        } else {
            stableChecks = 0;
        }

        lastSignature = signature;

        if (explicitlyReady) {
            CXBoot.set(96, "Verificando interfaz…");
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    setTimeout(() => { CXBoot.ready(); }, 200);
                });
            });
            return;
        }

        if (usable.length >= MIN_COINS && stableChecks >= 4) {
            CXBoot.set(96, "Preparando interfaz…");
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    setTimeout(() => { CXBoot.ready(); }, 500);
                });
            });
            return;
        }

        if (usable.length > 0) {
            const dataProgress = Math.min(92, 55 + (usable.length / MIN_COINS) * 35);
            CXBoot.set(dataProgress, "Procesando activos…");
        } else {
            CXBoot.set(25, "Esperando datos de mercado…");
        }

        if (performance.now() - START >= MAX_WAIT) {
            CXBoot.fail(
                "Los datos de mercado no están listos",
                "CriptoshX recibió una respuesta incompleta o incompatible. Puedes reintentar la sincronización."
            );
            return;
        }

        setTimeout(inspect, 350);
    }

    function start() {
        if (startedChecking) return;
        startedChecking = true;
        setTimeout(inspect, 150);
    }

    if (document.readyState === "complete") {
        start();
    } else {
        window.addEventListener("load", start, { once: true });
    }
})();
</script>
